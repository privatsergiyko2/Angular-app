@if (profile) {
  <div class="profile-card">
    <div class="avatar-name">
      <img
        [src]=" 'https://icherniakov.ru/yt-course/' + profile.avatarUrl"
      alt="avatar"
      class="profile-card__avatar"
      >

      <div class="profile-card__name">
        <strong class="h6">{{ profile.firstName }} {{ profile.lastName }}</strong>
        <span class="subtitle">cknvnv</span>
      </div>
    </div>
    <div class="profile-card__description">
      <!--    Список навыков, который мы обсудили выше, — основа резюме, но не единственная его часть. Также можно рассказать-->
      <!--    о себе в классическом смысле — этот раздел можно добавить в сопроводительное письмо.¬-->
      {{ profile.description }}
    </div>

    <div class="profile-card__tags">
      @for (skill of profile.stack; track skill) {
        <div class="skill-tag">{{ skill }}</div>
      }
    </div>

    <div class="profile-card__action-btns">
      <button class="btn">Подписаться</button>
    </div>
  </div>
}

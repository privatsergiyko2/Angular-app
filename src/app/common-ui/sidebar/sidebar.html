<img
  src="/assets/svg/logo-smal.svg"
  alt=""
  class="ml-16 mb-20">

<nav>
  <ul class="main-menu-list">
    <li *ngFor="let menuItem of menuItems">
      <a class="menu-item" [routerLink]="[menuItem]">
      <button class="menu-item">
        <svg [icon]="menuItem.icon"></svg>
        <span>{{menuItem.label}}</span>
      </button>
      </a>
    </li>
  </ul>
</nav>

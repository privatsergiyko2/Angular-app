@if (profile$ | async; as profile) {
  <header class="profile-page__header">
    <app-profile-header
      [profile]="profile">
    </app-profile-header>

    <a class="btn to-setting-btn" [routerLink]="['/settings']">
      Редактировать
      <svg icon="settings" class="to-settings-icon"></svg>
      <!--      <img src="/assets/svg/settings.svg" alt="" class="to-settings-icon">-->
    </a>
  </header>

  <main class="profile-page__body">
    <app-post-feed></app-post-feed>

    <div>
      <h3 class="h6 mb-16">Подписчики</h3>
      <div class="subscribers-wrapper mb-32">
        @for (subscriber of subscribers$ | async; track subscriber.id) {
          <a class="subscriber-avatar-btn" [routerLink]="['/profile', subscriber.id]">
            <img [src]="'https://icherniakov.ru/yt-course/' + subscriber.avatarUrl"/>
          </a>
        }
        <a class="to-subscribers-search" [routerLink]="['/search']">
        </a>


      </div>
      <h3 class="h6 mb-16">Навички</h3>
      <div class="stack-wrapper mb-32">
      @for (skill of profile.stack; track skill) {
        <div class="skill-tag">{{skill}}</div>
      }
      </div>
      <h3 class="h6 mb-16">О Себе</h3>
      <p class="medium-text">{{profile.description}}</p>
    </div>
  </main>
}
